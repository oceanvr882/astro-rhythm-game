<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Initializing...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050f;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag; /* Window can be moved by clicking background */
        }
        #ls-root {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }
        #ls-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #ls-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            z-index: 2;
        }
        #ls-logo {
            width: 72px; height: 72px;
            position: relative;
        }
        #ls-ring-outer {
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 1.5px solid rgba(120,80,255,0.18);
            animation: ls-spin 3s linear infinite;
        }
        #ls-ring-inner {
            position: absolute; inset: 8px;
            border-radius: 50%;
            border: 1px solid rgba(80,200,200,0.15);
            animation: ls-spin 2s linear infinite reverse;
        }
        #ls-core {
            position: absolute; inset: 20px;
            border-radius: 50%;
            background: rgba(120,80,255,0.12);
            display: flex; align-items: center; justify-content: center;
        }
        #ls-dot {
            width: 16px; height: 16px; border-radius: 50%;
            background: #a78bfa;
            animation: ls-pulse 2s ease-in-out infinite;
        }
        #ls-arc {
            position: absolute; inset: 0;
            animation: ls-spin 1.4s linear infinite;
        }
        #ls-title {
            font-size: 13px;
            letter-spacing: 0.22em;
            color: rgba(200,190,255,0.55);
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
        }
        #ls-bar-wrap {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.07);
            border-radius: 2px;
            overflow: hidden;
        }
        #ls-bar {
            height: 100%;
            width: 0%;
            background: #a78bfa;
            border-radius: 2px;
            transition: width 0.12s linear;
        }
        #ls-pct {
            font-size: 11px;
            color: rgba(180,160,255,0.4);
            font-family: monospace;
            letter-spacing: 0.08em;
            margin-top: 10px;
        }
        #ls-msg {
            font-size: 12px;
            color: rgba(180,160,255,0.35);
            font-family: monospace;
            letter-spacing: 0.06em;
            min-height: 16px;
            transition: opacity 0.4s;
            margin-top: 5px;
        }
        @keyframes ls-spin { to { transform: rotate(360deg); } }
        @keyframes ls-pulse {
            0%,100% { opacity: 0.6; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="ls-root">
        <canvas id="ls-canvas"></canvas>
        <div id="ls-center">
            <div id="ls-logo">
                <div id="ls-ring-outer"></div>
                <div id="ls-ring-inner"></div>
                <div id="ls-core"><div id="ls-dot"></div></div>
                <svg id="ls-arc" viewBox="0 0 72 72">
                    <circle cx="36" cy="36" r="34" fill="none" stroke="#a78bfa" stroke-width="1.5"
                      stroke-dasharray="40 174" stroke-linecap="round" opacity="0.7"/>
                </svg>
            </div>
            <div id="ls-title">ASTRO INITIALIZING</div>
            <div style="display:flex;flex-direction:column;align-items:center;">
                <div id="ls-bar-wrap"><div id="ls-bar"></div></div>
                <div id="ls-pct">0%</div>
                <div id="ls-msg">booting system core...</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ls-canvas');
        const ctx = canvas.getContext('2d');
        const bar = document.getElementById('ls-bar');
        const pct = document.getElementById('ls-pct');
        const msg = document.getElementById('ls-msg');
        
        let W, H, particles = [];
        let progress = 0, targetProgress = 0;
        
        const messages = [
            'booting system core...', 'loading assets...', 'calibrating sensors...',
            'syncing data streams...', 'initializing modules...', 'ready.'
        ];

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            spawnParticles();
        }

        function spawnParticles() {
            particles = Array.from({length: 60}, () => ({
                x: Math.random() * W, y: Math.random() * H,
                r: Math.random() * 1.5 + 0.5,
                vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                opacity: Math.random() * 0.5 + 0.1,
            }));
        }

        function drawFrame() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(167, 139, 250, ${p.opacity})`;
                ctx.fill();
            });

            progress += (targetProgress - progress) * 0.05;
            bar.style.width = Math.round(progress) + '%';
            pct.textContent = Math.round(progress) + '%';

            requestAnimationFrame(drawFrame);
        }

        let msgIndex = 0;
        function runProgress() {
            const steps = [20, 45, 68, 85, 100];
            steps.forEach((val, i) => {
                setTimeout(() => {
                    targetProgress = val;
                    if (msgIndex < messages.length) msg.textContent = messages[msgIndex++];
                }, i * 600);
            });
        }

        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(drawFrame);
        runProgress();
    </script>
</body>
</html>
